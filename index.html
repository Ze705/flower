<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHERIA — No. 06 Starlit Ocean Anthesis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Plus+Jakarta+Sans:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: rgba(242, 247, 255, 0.94);
      --ink-dim: rgba(186, 212, 245, 0.48);
      --ink-faint: rgba(186, 212, 245, 0.16);
      --accent: #7dd3fc;
      --gold: #f5d076;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010206;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    #input-video {
      display: none;
    }

    /* ==========================================
       策展级极简排版界面 (Curatorial Editorial UI)
       ========================================== */
    .ui-frame {
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.pure-mode .ui-frame {
      opacity: 0;
      pointer-events: none;
    }

    .gallery-border {
      position: fixed;
      inset: 24px;
      border: 1px solid rgba(255, 255, 255, 0.045);
      pointer-events: none;
      z-index: 5;
    }

    /* 左上角：高定艺术展签 */
    header.exhibition-header {
      position: fixed;
      top: 44px;
      left: 48px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .catalog-index {
      font-family: "Space Mono", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-dim);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .catalog-index::before {
      content: "";
      display: inline-block;
      width: 18px;
      height: 1px;
      background: var(--gold);
      opacity: 0.75;
    }

    .exhibition-title {
      font-family: "Cormorant Garamond", "Noto Serif SC", serif;
      font-size: 2.35rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      line-height: 1.05;
      color: #ffffff;
    }

    .exhibition-title em {
      font-style: italic;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: 0.12em;
    }

    .exhibition-caption {
      font-family: "Noto Serif SC", "Cormorant Garamond", serif;
      font-size: 0.76rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: var(--ink-dim);
      margin-top: 2px;
    }

    .sensor-line {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Space Mono", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--ink-dim);
    }

    .sensor-pip {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d97706;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .sensor-pip.online {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    /* 右上角：无边框编辑式文字导航 */
    nav.editorial-nav {
      position: fixed;
      top: 46px;
      right: 48px;
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .nav-item {
      position: relative;
      background: none;
      border: none;
      padding: 4px 0;
      font-family: "Cormorant Garamond", "Noto Serif SC", serif;
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: var(--ink-dim);
      cursor: pointer;
      transition: color 0.35s ease;
    }

    .nav-item::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-item:hover {
      color: var(--ink);
    }

    .nav-item.active {
      color: #ffffff;
    }

    .nav-item.active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav-sep {
      width: 1px;
      height: 12px;
      background: var(--ink-faint);
    }

    .action-link {
      background: none;
      border: none;
      font-family: "Space Mono", monospace;
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.3s ease;
    }

    .action-link:hover, .action-link.active {
      color: var(--accent);
    }

    /* 极简无框滑块面板 */
    #tuning-sheet {
      width: 240px;
      padding-top: 14px;
      border-top: 1px solid var(--ink-faint);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #tuning-sheet.hidden {
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
    }

    .param-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .param-head {
      display: flex;
      justify-content: space-between;
      font-family: "Space Mono", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--ink-dim);
    }

    .param-head span:last-child {
      color: var(--ink);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent);
      transition: transform 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.35);
    }

    /* 左下角：策展交互说明与绽放标尺 */
    footer.exhibition-footer {
      position: fixed;
      bottom: 42px;
      left: 48px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: none;
    }

    .bloom-meter {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .meter-label {
      font-family: "Space Mono", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      color: var(--ink-dim);
    }

    .meter-track {
      width: 140px;
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
      position: relative;
    }

    .meter-fill {
      position: absolute;
      left: 0;
      top: -0.5px;
      height: 2px;
      width: 15%;
      background: linear-gradient(90deg, var(--accent), #ffffff);
      box-shadow: 0 0 10px var(--accent);
    }

    .meter-num {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--ink);
      min-width: 38px;
    }

    .gesture-notes {
      display: flex;
      gap: 24px;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: var(--ink-dim);
    }

    .gesture-notes span i {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--ink);
      margin-right: 6px;
    }

    /* 右下角：极简手势光学镜面 */
    #optical-mirror {
      position: fixed;
      bottom: 42px;
      right: 48px;
      width: 148px;
      height: 104px;
      z-index: 10;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(2, 4, 10, 0.4);
      transition: opacity 0.4s ease;
    }

    #optical-mirror.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #output-canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      object-fit: cover;
      opacity: 0.78;
      filter: contrast(1.15) saturate(0.4);
    }

    .mirror-tag {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-family: "Space Mono", monospace;
      font-size: 0.52rem;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }

    /* 快门闪光提示 */
    #flash-veil {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.45s ease;
    }

    /* 启动幕布 */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #010206;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .loading-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.36em;
      color: #ffffff;
    }

    .loading-sub {
      font-family: "Space Mono", monospace;
      font-size: 0.64rem;
      letter-spacing: 0.24em;
      color: var(--ink-dim);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script src="./vendor/camera_utils.js" crossorigin="anonymous"></script>

</head>
<body>

  <div id="loading-overlay">
    <div class="loading-title">A E T H E R I A</div>
    <div class="loading-sub">WEAVING STARLIT OCEAN &amp; LUMINOUS LOTUS</div>
  </div>

  <div id="flash-veil"></div>
  <div class="gallery-border ui-frame"></div>

  <!-- 左上角：策展级作品铭文 -->
  <header class="exhibition-header ui-frame">
    <div class="catalog-index">ARCHIVE NO. 06 &nbsp;/&nbsp; STARLIT OCEAN</div>
    <h1 class="exhibition-title">AETHERIA <em>Pelagic</em></h1>
    <div class="exhibition-caption">星辰大海 · 九重琉璃星莲光影雕塑</div>
    <div class="sensor-line">
      <span class="sensor-pip" id="status-dot"></span>
      <span id="status-text">AWAITING OPTICAL HAND SENSOR</span>

  <!-- 右上角：无边框高定编辑导航 -->
  <nav class="editorial-nav ui-frame">
    <div class="nav-row">
      <button class="nav-item active" data-theme="sapphire">星海深蓝</button>
      <button class="nav-item" data-theme="celestia">冰川月华</button>

      <button class="action-link" id="btn-mode" title="切换手势控制 / 自动呼吸模式">MODE: HAND</button>
      <button class="action-link" id="btn-sound" title="开启/关闭空灵环境音景">SOUND: OFF</button>
      <button class="action-link" id="btn-capture" title="定格当前高清艺术画面">CAPTURE</button>

    <!-- 极简细线参数调节区 -->
    <div id="tuning-sheet" class="hidden">
      <div class="param-item">
        <div class="param-head"><span>VORTEX ORBIT</span><span id="val-vortex">1.35</span></div>
        <input type="range" id="ctrl-vortex" min="0.2" max="2.5" step="0.05" value="1.35" />
      </div>
      <div class="param-item">
        <div class="param-head"><span>LUMINESCENCE</span><span id="val-bloom">1.05</span></div>
        <input type="range" id="ctrl-bloom" min="0.3" max="1.6" step="0.05" value="1.05" />
      </div>
      <div class="param-item">
        <div class="param-head"><span>ROTATION</span><span id="val-spin">0.20</span></div>
        <input type="range" id="ctrl-spin" min="0.0" max="0.7" step="0.02" value="0.20" />
      </div>
    </div>
  </nav>

  <!-- 左下角：绽放刻度与交互诗意指引 -->
  <footer class="exhibition-footer ui-frame">
    <div class="bloom-meter">
      <span class="meter-label">ANTHESIS</span>
      <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      <span class="meter-num" id="meter-num">14%</span>
    </div>
    <div class="gesture-notes">
      <span><i>I.</i>握拳凝聚星蕾</span>
      <span><i>II.</i>舒展倾泻星海</span>
      <span><i>III.</i>拖拽视角 / 滚轮缩放</span>
    </div>
  </footer>

  <!-- 右下角：极简手势光学镜面 -->
  <div id="optical-mirror" class="ui-frame">
    <video id="input-video" playsinline></video>
    <canvas id="output-canvas" width="320" height="240"></canvas>
    <span class="mirror-tag">OPTICAL TRACK</span>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ==========================================
    // 1. 星辰大海高级定制光影色系
    // ==========================================
    const THEMES = {
      sapphire: {
        core: new THREE.Color('#ffd166'),       // 熔金星核花蕊
        coreTip: new THREE.Color('#ffffff'),    // 白金钻石花药
        base: new THREE.Color('#0c1e52'),       // 深海午夜蓝花根
        mid: new THREE.Color('#0284c7'),        // 琉璃蔚蓝中段
        iridescent: new THREE.Color('#818cf8'), // 星河靛紫折射
        rim: new THREE.Color('#e0f2fe'),        // 冰晶银白亮边
        pearl: new THREE.Color('#ffffff'),
        vortexA: new THREE.Color('#38bdf8'),    // 星旋冰蓝
        vortexB: new THREE.Color('#fde68a'),    // 星旋碎金
        oceanDeep: new THREE.Color('#061a3a'),  // 深海波谷
        oceanCrest: new THREE.Color('#7dd3fc'), // 星海浪尖星光
        bgZenith: new THREE.Color('#010308'),
        bgHorizon: new THREE.Color('#071a36'),
        skeleton: '#7dd3fc',
        cssAccent: '#7dd3fc'
      },
      celestia: {
        core: new THREE.Color('#fef08a'),
        coreTip: new THREE.Color('#ffffff'),
        base: new THREE.Color('#1e293b'),
        mid: new THREE.Color('#7dd3fc'),
        iridescent: new THREE.Color('#c4b5fd'),
        rim: new THREE.Color('#ffffff'),
        pearl: new THREE.Color('#e0f2fe'),
        vortexA: new THREE.Color('#bae6fd'),
        vortexB: new THREE.Color('#e9d5ff'),
        oceanDeep: new THREE.Color('#0b172a'),
        oceanCrest: new THREE.Color('#e0f2fe'),
        bgZenith: new THREE.Color('#02040a'),
        bgHorizon: new THREE.Color('#0d1e36'),
        skeleton: '#bae6fd',
        cssAccent: '#bae6fd'
      },
      sakura: {
        core: new THREE.Color('#fcd34d'),
        coreTip: new THREE.Color('#ffffff'),
        base: new THREE.Color('#500724'),
        mid: new THREE.Color('#e11d48'),
        iridescent: new THREE.Color('#a855f7'),
        rim: new THREE.Color('#ffe4e6'),
        pearl: new THREE.Color('#ffffff'),
        vortexA: new THREE.Color('#fda4af'),
        vortexB: new THREE.Color('#fde68a'),
        oceanDeep: new THREE.Color('#1f0714'),
        oceanCrest: new THREE.Color('#fecdd3'),
        bgZenith: new THREE.Color('#040105'),
        bgHorizon: new THREE.Color('#1d0815'),
        skeleton: '#fda4af',
        cssAccent: '#fda4af'
      }
    };

    let activeTheme = THEMES.sapphire;

    // ==========================================
    // 2. 交互参数与物理状态
    // ==========================================
    const params = {
      vortexSpeed: 1.35,
      bloomStrength: 1.05,
      spinSpeed: 0.20,
      autoBreathe: false
    };

    const state = {
      targetBloom: 0.14,
      currentBloom: 0.14,
      prevBloom: 0.14,
      pulseWave: 0.0,
      vortexSurge: 0.0,
      targetPos: new THREE.Vector3(0, -0.25, 0),
      currentPos: new THREE.Vector3(0, -0.25, 0),
      targetRot: new THREE.Euler(0.32, 0, 0),
      currentRot: new THREE.Euler(0.32, 0, 0),
      handDetected: false
    };

    // ==========================================
    // 3. Web Audio API 空灵环境音景
    // ==========================================
    class EtherealSoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.masterGain = null;
        this.filterNode = null;
        this.lastChimeTime = 0;
      }

      toggle() {
        if (!this.ctx) this.init();
        this.enabled = !this.enabled;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.18 : 0.0, now, 0.4);
        return this.enabled;
      }

      init() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0;

        this.filterNode = this.ctx.createBiquadFilter();
        this.filterNode.type = 'lowpass';
        this.filterNode.frequency.value = 420;
        this.filterNode.Q.value = 1.5;

        this.filterNode.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);

        const freqs = [73.42, 110.0, 164.81, 185.0];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.value = f;
          gain.gain.value = 0.16 / (idx + 1);
          osc.connect(gain);
          gain.connect(this.filterNode);
          osc.start();
        });
      }

      update(bloom, velocity, elapsed) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const targetFreq = 260 + bloom * 1500;
        this.filterNode.frequency.setTargetAtTime(targetFreq, now, 0.15);

        if (velocity > 0.015 && bloom > 0.45 && elapsed - this.lastChimeTime > 0.45) {
          this.lastChimeTime = elapsed;
          this.triggerChime();
        }
      }

      triggerChime() {
        const scale = [587.33, 659.25, 739.99, 880.0, 1174.66, 1318.51];
        const freq = scale[Math.floor(Math.random() * scale.length)];
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.14, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 2.5);
      }
    }

    const soundEngine = new EtherealSoundEngine();

    // ==========================================
    // 4. Three.js 场景与 ACES 电影级后期管线
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 220);
    camera.position.set(0, 3.0, 10.8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 5.2;
    controls.maxDistance = 19.0;
    controls.maxPolarAngle = Math.PI * 0.56;
    controls.target.set(0, 0.1, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      params.bloomStrength,
      0.72,
      0.24
    );
    composer.addPass(bloomPass);

    // ==========================================
    // 5. 星辰大海 · 浩瀚天穹与银河辉光底幕
    // ==========================================
    const skyBgMaterial = new THREE.ShaderMaterial({
      depthWrite: false,
      depthTest: false,
      uniforms: {
        uTime: { value: 0 },
        uBloom: { value: state.currentBloom },
        uZenith: { value: activeTheme.bgZenith.clone() },
        uHorizon: { value: activeTheme.bgHorizon.clone() },
        uAccent: { value: activeTheme.vortexA.clone() },
        uGold: { value: activeTheme.core.clone() },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 1.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uBloom;
        uniform vec3 uZenith;
        uniform vec3 uHorizon;
        uniform vec3 uAccent;
        uniform vec3 uGold;
        uniform vec2 uResolution;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p = rot * p * 2.04;
            a *= 0.5;
          }
          return v;
        }

        float ign(vec2 p) {
          return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
        }

        void main() {
          vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);
          vec2 uv = (vUv - 0.5) * aspect;

          // 1. 深海天幕纵向渐变（海天一线处泛起深邃星海微蓝）
          float horizonBand = exp(-abs(vUv.y - 0.34) * 4.5);
          vec3 col = mix(uZenith, uHorizon, smoothstep(0.95, 0.25, vUv.y) * 0.72 + horizonBand * 0.45);

          // 2. 倾斜贯穿夜空的淡淡银河星带 (Milky Way)
          vec2 mwUv = vec2(uv.x * 0.82 - uv.y * 0.57, uv.x * 0.57 + uv.y * 0.82);
          float mwBand = exp(-abs(mwUv.y + 0.05) * 4.8);
          float dustRift = fbm(mwUv * 3.2 + vec2(uTime * 0.008, 0.0));
          float mwCloud = mwBand * smoothstep(0.28, 0.82, dustRift);
          col += mix(uAccent, uGold, 0.22) * mwCloud * (0.09 + 0.06 * uBloom);

          // 3. 花朵后方的星海光晕呼吸
          float centerDist = length(uv - vec2(0.0, 0.02));
          col += uHorizon * exp(-centerDist * (2.2 - uBloom * 0.5)) * (0.35 + 0.45 * uBloom);

          // 4. 海面映照的垂向星光倒影柱
          float reflectionMask = smoothstep(0.36, 0.0, vUv.y);
          float pillar = exp(-abs(uv.x) * (5.5 - uBloom * 1.8));
          col += mix(uAccent, uGold, 0.3) * reflectionMask * pillar * (0.06 + 0.10 * uBloom);

          col += (ign(gl_FragCoord.xy) - 0.5) * 0.007;
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    const skyBgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyBgMaterial);
    skyBgMesh.frustumCulled = false;
    skyBgMesh.renderOrder = -100;
    scene.add(skyBgMesh);

    // ==========================================
    // 6. 星辰大海 · 3D 浩瀚星空穹顶 (6,500 颗带十字星芒的闪烁恒星)
    // ==========================================
    const starCount = 6500;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    // [size, phase, colorMix, isBrightStar]
    const starAttr = new Float32Array(starCount * 4);

    for (let i = 0; i < starCount; i++) {
      const i3 = i * 3;
      const i4 = i * 4;
      // 分布在远景穹顶与地平线星海上方
      const r = 18.0 + Math.random() * 55.0;
      const theta = Math.random() * Math.PI * 2;
      const u = Math.random();
      // 让星辰在银河带与海平面附近更密集
      const phi = Math.acos(1.0 - u * 1.18);

      starPos[i3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i3 + 1] = r * Math.cos(phi) - 2.0;
      starPos[i3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 8.0;

      const isBright = Math.random() > 0.92 ? 1.0 : 0.0;
      starAttr[i4] = isBright ? (2.4 + Math.random() * 2.2) : (0.65 + Math.random() * 1.25);
      starAttr[i4 + 1] = Math.random() * Math.PI * 2;
      starAttr[i4 + 2] = Math.random(); // 0: 冰蓝星, 0.5: 纯白星, 1.0: 暖金星
      starAttr[i4 + 3] = isBright;
    }

    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('aStar', new THREE.BufferAttribute(starAttr, 4));

    const starMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uBloom: { value: state.currentBloom },
        uCoolColor: { value: activeTheme.vortexA.clone() },
        uWarmColor: { value: activeTheme.core.clone() },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uBloom;
        uniform float uPixelRatio;
        attribute vec4 aStar;
        varying float vAlpha;
        varying float vColorMix;
        varying float vIsBright;

        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;

          float twinkle = 0.55 + 0.45 * sin(uTime * (1.2 + aStar.z * 2.2) + aStar.y);
          float sizeBoost = 1.0 + uBloom * 0.25 * aStar.w;
          gl_PointSize = aStar.x * sizeBoost * uPixelRatio * (26.0 / -mv.z);

          vAlpha = twinkle * (aStar.w > 0.5 ? 0.95 : (0.35 + 0.35 * aStar.z));
          vColorMix = aStar.z;
          vIsBright = aStar.w;
        }
      `,
      fragmentShader: `
        uniform vec3 uCoolColor;
        uniform vec3 uWarmColor;
        varying float vAlpha;
        varying float vColorMix;
        varying float vIsBright;

        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;

          float core = smoothstep(0.14, 0.0, d);
          float halo = pow(1.0 - d * 2.0, 2.6);

          // 亮星专属的细腻十字星芒 (Diffraction Spikes)
          float spike = 0.0;
          if (vIsBright > 0.5) {
            float sx = exp(-abs(uv.y) * 28.0) * smoothstep(0.5, 0.0, abs(uv.x));
            float sy = exp(-abs(uv.x) * 28.0) * smoothstep(0.5, 0.0, abs(uv.y));
            spike = (sx + sy) * 0.65;
          }

          float alpha = (core * 0.95 + halo * 0.42 + spike) * vAlpha;
          vec3 starTint = mix(uCoolColor, vec3(1.0), 0.55);
          starTint = mix(starTint, uWarmColor, smoothstep(0.65, 1.0, vColorMix) * 0.7);
          vec3 col = mix(starTint, vec3(1.0), core * 0.7 + spike * 0.5);

          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const starDome = new THREE.Points(starGeo, starMaterial);
    scene.add(starDome);

    // ==========================================
    // 7. 星辰大海 · 28,000 粒子波光星海 (Starlit Ocean Surface)
    // ==========================================
    const oceanCount = 28000;
    const oceanGeo = new THREE.BufferGeometry();
    const oceanPos = new Float32Array(oceanCount * 3);
    const oceanSeed = new Float32Array(oceanCount * 3); // [radialNorm, angle, sparkleSeed]

    for (let i = 0; i < oceanCount; i++) {
      // 同心圆放射分布：近处密集细腻，向远方海天交界处无垠延伸
      const rNorm = Math.pow(Math.random(), 0.78);
      const r = 0.4 + rNorm * 36.0;
      const theta = Math.random() * Math.PI * 2;

      oceanPos[i * 3] = Math.cos(theta) * r;
      oceanPos[i * 3 + 1] = -2.55;
      oceanPos[i * 3 + 2] = Math.sin(theta) * r - 1.5;

      oceanSeed[i * 3] = rNorm;
      oceanSeed[i * 3 + 1] = theta;
      oceanSeed[i * 3 + 2] = Math.random();
    }

    oceanGeo.setAttribute('position', new THREE.BufferAttribute(oceanPos, 3));
    oceanGeo.setAttribute('aOcean', new THREE.BufferAttribute(oceanSeed, 3));

    const oceanMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uBloom: { value: state.currentBloom },
        uPulse: { value: 0 },
        uDeepColor: { value: activeTheme.oceanDeep.clone() },
        uCrestColor: { value: activeTheme.oceanCrest.clone() },
        uGoldColor: { value: activeTheme.core.clone() },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uBloom;
        uniform float uPulse;
        uniform float uPixelRatio;
        attribute vec3 aOcean;
        varying float vAlpha;
        varying float vCrest;
        varying float vGoldMix;

        void main() {
          vec3 p = position;
          float r = length(p.xz);
          float seed = aOcean.z;

          // 1. 多重海浪涌动 (Ocean Swells)
          float wave1 = sin(p.x * 0.42 + uTime * 1.15) * cos(p.z * 0.36 + uTime * 0.85) * 0.22;
          float wave2 = sin(r * 0.85 - uTime * 1.65 + seed * 2.0) * 0.11;
          float ripple = sin(p.x * 1.8 - p.z * 1.4 + uTime * 2.2) * 0.045;

          // 2. 花朵盛开激发的海面光之涟漪 (Bloom Caustic Ripple)
          float pulseRadius = uPulse * 18.0;
          float bloomWave = exp(-abs(r - pulseRadius) * 0.65) * step(0.01, uPulse) * 0.34;

          float totalHeight = wave1 + wave2 + ripple + bloomWave;
          p.y += totalHeight;

          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;

          // 波峰与花心倒影处粒子更璀璨
          float crest = smoothstep(-0.15, 0.28, totalHeight);
          float centerMirror = exp(-r * 0.16) * (0.45 + 0.75 * uBloom);
          float starGlint = pow(0.5 + 0.5 * sin(uTime * 4.2 + seed * 38.0), 4.0);

          float size = (0.65 + crest * 1.15 + starGlint * 1.1) * uPixelRatio * (15.5 / -mv.z);
          gl_PointSize = clamp(size, 0.8, 6.5);

          float distFade = smoothstep(37.0, 4.0, r);
          vAlpha = distFade * (0.14 + crest * 0.38 + centerMirror * 0.32 + starGlint * 0.28 + bloomWave * 0.7);
          vCrest = crest;
          vGoldMix = centerMirror * (0.4 + 0.6 * seed);
        }
      `,
      fragmentShader: `
        uniform vec3 uDeepColor;
        uniform vec3 uCrestColor;
        uniform vec3 uGoldColor;
        varying float vAlpha;
        varying float vCrest;
        varying float vGoldMix;

        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          // 水面波光横向微微拉长，呈现真实的粼粼波光质感
          uv.y *= 1.45;
          float d = length(uv);
          if (d > 0.5) discard;

          float core = smoothstep(0.18, 0.0, d);
          float glow = pow(1.0 - d * 2.0, 2.2);
          float alpha = (core * 0.8 + glow * 0.45) * vAlpha;

          vec3 waterCol = mix(uDeepColor, uCrestColor, vCrest * 0.85 + 0.15);
          waterCol = mix(waterCol, uGoldColor, clamp(vGoldMix, 0.0, 0.85));
          waterCol = mix(waterCol, vec3(1.0), core * 0.55);

          gl_FragColor = vec4(waterCol, alpha);
        }
      `
    });

    const starOcean = new THREE.Points(oceanGeo, oceanMaterial);
    scene.add(starOcean);

    // ==========================================
    // 8. 极致华丽 · 88,000 粒子「九重星穹琉璃莲」
    // ==========================================
    const flowerVertexShader = `
      uniform float uTime;
      uniform float uBloom;
      uniform float uPulse;
      uniform float uPixelRatio;

      attribute vec3 aBudPos;
      attribute vec3 aBloomPos;
      attribute vec3 aColor;
      attribute float aSize;
      attribute float aRim;
      attribute float aRandom;

      varying vec3 vColor;
      varying float vAlpha;
      varying float vRim;

      mat2 rot2D(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      void main() {
        vColor = aColor;
        vRim = aRim;

        float t = clamp(uBloom, 0.0, 1.0);
        // 更加饱满舒展的缓动曲线，盛开瞬间张力十足
        float ease = t * t * (3.0 - 2.0 * t);

        vec3 pos = mix(aBudPos, aBloomPos, ease);

        // 花苞收拢时的古典螺旋交叠
        float radialDist = length(pos.xz);
        float spiral = (1.0 - ease) * 1.45 * (radialDist * 0.6);
        pos.xz = rot2D(spiral) * pos.xz;

        // 绽放二重奏光波脉冲
        float wave1 = smoothstep(1.35, 0.0, abs(radialDist - uPulse * 8.2)) * step(0.01, uPulse);
        float wave2 = smoothstep(1.1, 0.0, abs(radialDist - max(0.0, uPulse - 0.22) * 8.2)) * step(0.23, uPulse);
        float shock = wave1 + wave2 * 0.65;
        pos.y += shock * 0.28;

        // 盛开时花瓣微风摇曳与星辉呼吸
        float breeze = 0.02 + 0.068 * ease;
        pos.x += sin(uTime * 1.35 + aRandom * 6.28 + pos.y * 0.9) * breeze;
        pos.z += cos(uTime * 1.15 + aRandom * 6.28 + pos.x * 0.9) * breeze;
        pos.y += sin(uTime * 1.75 + radialDist * 1.9) * 0.032 * ease;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mvPosition;

        float sizeScale = mix(0.85, 1.18, ease) + shock * 0.45;
        gl_PointSize = aSize * sizeScale * uPixelRatio * (17.2 / -mvPosition.z);

        vAlpha = mix(0.34, 0.84, aRim) * mix(0.78, 1.0, ease) + shock * 0.28;
        vColor += vec3(0.24, 0.28, 0.35) * shock;
      }
    `;

    const flowerFragmentShader = `
      varying vec3 vColor;
      varying float vAlpha;
      varying float vRim;

      void main() {
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        if (d > 0.5) discard;

        float core = smoothstep(0.17, 0.0, d);
        float halo = pow(max(0.0, 1.0 - d * 2.0), 2.3);

        float alpha = (core * 0.80 + halo * 0.46) * vAlpha;
        vec3 col = mix(vColor, vec3(1.0), core * (0.40 + 0.40 * vRim));

        gl_FragColor = vec4(col, alpha);
      }
    `;

    const FLOWER_SCALE = 1.72;

    function buildFlowerGeometry(theme) {
      const stamenCount = 6800;     // 更华丽的双层皇冠金蕊
      const petalParticles = 78000; // 8层58片繁复重瓣
      const stemCount = 3200;       // 底部星河垂坠光托
      const totalCount = stamenCount + petalParticles + stemCount;

      const budPositions = new Float32Array(totalCount * 3);
      const bloomPositions = new Float32Array(totalCount * 3);
      const colors = new Float32Array(totalCount * 3);
      const sizes = new Float32Array(totalCount);
      const rims = new Float32Array(totalCount);
      const randoms = new Float32Array(totalCount);

      let idx = 0;

      // A. 双层皇冠熔金花蕊 (64 根光丝 + 星芒花药)
      const filamentCount = 64;
      for (let i = 0; i < stamenCount; i++) {
        const i3 = idx * 3;
        randoms[idx] = Math.random();

        const fIdx = i % filamentCount;
        const goldenAngle = fIdx * 2.39996;
        const ringRatio = Math.sqrt((fIdx + 0.5) / filamentCount);

        const isAnther = Math.random() > 0.68;
        const t = isAnther ? 0.88 + Math.random() * 0.12 : Math.pow(Math.random(), 0.72) * 0.92;

        const rBud = (0.07 + ringRatio * 0.25) * (1.0 - t * 0.35) * FLOWER_SCALE;
        const hBud = (-0.15 + t * 1.62) * FLOWER_SCALE;
        budPositions[i3] = Math.cos(goldenAngle) * rBud + (Math.random() - 0.5) * 0.04;
        budPositions[i3 + 1] = hBud;
        budPositions[i3 + 2] = Math.sin(goldenAngle) * rBud + (Math.random() - 0.5) * 0.04;

        // 盛开时内外两圈花蕊形成华丽的皇冠弧度
        const crownArch = Math.sin(t * Math.PI * 0.6) * (1.35 - ringRatio * 0.28);
        const spread = (0.14 + ringRatio * 1.08) * Math.sin(t * Math.PI * 0.66) * FLOWER_SCALE;
        const hBloom = (-0.1 + crownArch) * FLOWER_SCALE;
        const jitter = (isAnther ? 0.06 : 0.018) * FLOWER_SCALE;

        bloomPositions[i3] = Math.cos(goldenAngle) * spread + (Math.random() - 0.5) * jitter;
        bloomPositions[i3 + 1] = hBloom + (Math.random() - 0.5) * jitter;
        bloomPositions[i3 + 2] = Math.sin(goldenAngle) * spread + (Math.random() - 0.5) * jitter;

        const c = theme.core.clone().lerp(theme.coreTip, isAnther ? 0.72 : 0.18);
        colors[i3] = c.r;
        colors[i3 + 1] = c.g;
        colors[i3 + 2] = c.b;

        sizes[idx] = isAnther ? 2.05 : 0.98;
        rims[idx] = isAnther ? 1.0 : 0.62;
        idx++;
      }

      // B. 8 层共 58 片繁复重瓣（外层大波浪反卷，华丽舒展）
      const layers = [
        { count: 5,  len: 1.65, width: 0.92, openAngle: 0.34, cup: 0.52, yOff: 0.10 },
        { count: 6,  len: 2.05, width: 1.15, openAngle: 0.56, cup: 0.46, yOff: 0.06 },
        { count: 7,  len: 2.48, width: 1.38, openAngle: 0.78, cup: 0.38, yOff: 0.01 },
        { count: 8,  len: 2.90, width: 1.62, openAngle: 1.00, cup: 0.30, yOff: -0.05 },
        { count: 8,  len: 3.32, width: 1.84, openAngle: 1.20, cup: 0.22, yOff: -0.12 },
        { count: 8,  len: 3.72, width: 2.04, openAngle: 1.38, cup: 0.14, yOff: -0.20 },
        { count: 8,  len: 4.10, width: 2.22, openAngle: 1.54, cup: 0.06, yOff: -0.28 },
        { count: 8,  len: 4.45, width: 2.38, openAngle: 1.68, cup: -0.02, yOff: -0.36 }
      ];

      const totalPetals = layers.reduce((acc, l) => acc + l.count, 0);
      const particlesPerPetal = Math.floor(petalParticles / totalPetals);

      layers.forEach((layer, lIdx) => {
        const layerRatio = lIdx / (layers.length - 1);

        for (let p = 0; p < layer.count; p++) {
          const baseAzimuth = (p / layer.count) * Math.PI * 2 + lIdx * 0.44;

          for (let k = 0; k < particlesPerPetal; k++) {
            if (idx >= stamenCount + petalParticles) break;
            const i3 = idx * 3;
            randoms[idx] = Math.random();

            const roll = Math.random();
            const isTipPearl = roll < 0.045;
            const isEdge = !isTipPearl && roll < 0.30;
            let u, v;

            if (isTipPearl) {
              v = 0.94 + Math.random() * 0.06;
              u = (Math.random() - 0.5) * 0.22;
            } else if (isEdge) {
              v = Math.pow(Math.random(), 0.7);
              const side = Math.random() < 0.5 ? -1 : 1;
              u = side * (0.94 + Math.random() * 0.06);
            } else {
              v = Math.pow(Math.random(), 0.64);
              const ribCount = 13.0;
              const rawU = (Math.random() * 2 - 1);
              const ribSnap = Math.sin(rawU * Math.PI * ribCount) * 0.045;
              u = THREE.MathUtils.clamp(rawU + ribSnap, -0.96, 0.96);
            }

            const widthProfile = Math.sin(Math.pow(v, 0.72) * Math.PI);
            const tipTaper = 1.0 - Math.pow(v, 4.0) * 0.34;
            const localX = u * (layer.width * 0.5) * widthProfile * tipTaper;
            const crossCup = (1.0 - u * u) * layer.cup * widthProfile;

            // 握拳花苞态
            const budTilt = 0.08 + layerRatio * 0.14;
            const budBowl = Math.sin(v * Math.PI) * (0.30 + layerRatio * 0.26);
            const budDist = (0.18 + layerRatio * 0.20 + v * layer.len * 0.76 * Math.sin(budTilt) + budBowl - crossCup * 0.5) * FLOWER_SCALE;
            const budY = (-0.25 + v * layer.len * 0.86 * Math.cos(budTilt) + layerRatio * 0.08) * FLOWER_SCALE;

            const budTwist = u * 0.38 * (1.0 - v * 0.3);
            const budAngle = baseAzimuth + budTwist;

            budPositions[i3] = Math.cos(budAngle) * budDist - Math.sin(budAngle) * localX * 0.55 * FLOWER_SCALE;
            budPositions[i3 + 1] = budY;
            budPositions[i3 + 2] = Math.sin(budAngle) * budDist + Math.cos(budAngle) * localX * 0.55 * FLOWER_SCALE;

            // 盛放态：外层花瓣优雅反卷与波浪花边
            const petalArch = Math.sin(v * Math.PI * 0.85) * (0.62 - layerRatio * 0.38);
            const tipCurl = Math.pow(v, 2.5) * (0.28 + layerRatio * 0.68);
            const ruffle = Math.sin(u * 5.0 + v * 3.2) * 0.065 * v * layerRatio;

            const radialReach = (0.22 + v * layer.len * Math.sin(layer.openAngle) + petalArch * 0.38) * FLOWER_SCALE;
            const bloomY = (layer.yOff
              + v * layer.len * Math.cos(layer.openAngle)
              + petalArch
              - tipCurl
              - crossCup * 0.45
              + ruffle) * FLOWER_SCALE;

            bloomPositions[i3] = Math.cos(baseAzimuth) * radialReach - Math.sin(baseAzimuth) * localX * FLOWER_SCALE;
            bloomPositions[i3 + 1] = bloomY;
            bloomPositions[i3 + 2] = Math.sin(baseAzimuth) * radialReach + Math.cos(baseAzimuth) * localX * FLOWER_SCALE;

            // 奢华五段式宝石虹彩着色
            const edgeFactor = Math.max(Math.abs(u), Math.pow(v, 2.1));
            const iridWave = Math.sin(v * Math.PI + layerRatio * 2.2) * Math.abs(u);
            const c = theme.base.clone()
              .lerp(theme.mid, Math.pow(v, 0.58) * 0.88 + layerRatio * 0.12)
              .lerp(theme.iridescent, iridWave * 0.48)
              .lerp(theme.rim, isEdge ? 0.90 : Math.pow(edgeFactor, 2.8) * 0.62);

            if (isTipPearl) {
              c.lerp(theme.pearl, 0.95);
            }

            colors[i3] = c.r;
            colors[i3 + 1] = c.g;
            colors[i3 + 2] = c.b;

            sizes[idx] = isTipPearl ? 2.35 : (isEdge ? (1.42 + Math.random() * 0.55) : (0.78 + Math.random() * 0.52));
            rims[idx] = isTipPearl ? 1.0 : (isEdge ? 0.98 : (0.22 + edgeFactor * 0.48));
            idx++;
          }
        }
      });

      // C. 底部星河垂坠光托
      while (idx < totalCount) {
        const i3 = idx * 3;
        randoms[idx] = Math.random();
        const t = Math.random();
        const spiralAngle = t * Math.PI * 8.0 + Math.random() * 0.5;
        const r = ((1.0 - t) * 0.85 + 0.05) * FLOWER_SCALE;
        const y = (-0.25 - t * 2.3) * FLOWER_SCALE;

        budPositions[i3] = Math.cos(spiralAngle) * r * 0.72;
        budPositions[i3 + 1] = y;
        budPositions[i3 + 2] = Math.sin(spiralAngle) * r * 0.72;

        bloomPositions[i3] = Math.cos(spiralAngle) * r * 1.28;
        bloomPositions[i3 + 1] = y - 0.1;
        bloomPositions[i3 + 2] = Math.sin(spiralAngle) * r * 1.28;

        const c = theme.base.clone().lerp(theme.vortexA, 1.0 - t).lerp(theme.core, Math.pow(1.0 - t, 3.0) * 0.4);
        colors[i3] = c.r;
        colors[i3 + 1] = c.g;
        colors[i3 + 2] = c.b;

        sizes[idx] = 0.88 + Math.random() * 0.85;
        rims[idx] = (1.0 - t) * 0.68;
        idx++;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(bloomPositions, 3));
      geo.setAttribute('aBudPos', new THREE.BufferAttribute(budPositions, 3));
      geo.setAttribute('aBloomPos', new THREE.BufferAttribute(bloomPositions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aRim', new THREE.BufferAttribute(rims, 1));
      geo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
      return geo;
    }

    const flowerMaterial = new THREE.ShaderMaterial({
      vertexShader: flowerVertexShader,
      fragmentShader: flowerFragmentShader,
      uniforms: {
        uTime: { value: 0 },
        uBloom: { value: state.currentBloom },
        uPulse: { value: 0 },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
      },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const flowerPoints = new THREE.Points(buildFlowerGeometry(activeTheme), flowerMaterial);
    const flowerGroup = new THREE.Group();
    flowerGroup.add(flowerPoints);
    scene.add(flowerGroup);

    // ==========================================
    // 9. 22,000 颗环绕绽放星旋粒子流 (10 条黄金螺旋银河旋臂)
    // ==========================================
    const vortexCount = 22000;
    const vortexGeo = new THREE.BufferGeometry();
    const vPos = new Float32Array(vortexCount * 3);
    const vAttr = new Float32Array(vortexCount * 4);

    for (let i = 0; i < vortexCount; i++) {
      const arm = i % 10;
      const armAngle = (arm / 10) * Math.PI * 2;
      const rNorm = Math.pow(Math.random(), 0.70);
      const spiralTwist = rNorm * 3.1 + (Math.random() - 0.5) * 0.52;
      const angle = armAngle + spiralTwist;

      vPos[i * 3] = Math.cos(angle);
      vPos[i * 3 + 1] = (Math.random() - 0.5) * 2.0;
      vPos[i * 3 + 2] = Math.sin(angle);

      vAttr[i * 4] = angle;
      vAttr[i * 4 + 1] = rNorm;
      vAttr[i * 4 + 2] = (Math.random() - 0.5);
      vAttr[i * 4 + 3] = Math.random();
    }

    vortexGeo.setAttribute('position', new THREE.BufferAttribute(vPos, 3));
    vortexGeo.setAttribute('aVortex', new THREE.BufferAttribute(vAttr, 4));

    const vortexMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uBloom: { value: state.currentBloom },
        uSurge: { value: 0 },
        uSpeed: { value: params.vortexSpeed },
        uColorA: { value: activeTheme.vortexA.clone() },
        uColorB: { value: activeTheme.vortexB.clone() },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uBloom;
        uniform float uSurge;
        uniform float uSpeed;
        uniform float uPixelRatio;
        attribute vec4 aVortex;
        varying float vAlpha;
        varying float vColorMix;
        varying float vSparkle;

        void main() {
          float baseAngle = aVortex.x;
          float rNorm = aVortex.y;
          float ySpread = aVortex.z;
          float seed = aVortex.w;

          float bloomEase = smoothstep(0.05, 0.95, uBloom);

          float innerR = mix(0.95, 2.3, bloomEase);
          float outerR = mix(1.9, 9.6, bloomEase) + uSurge * 1.25;
          float radius = mix(innerR, outerR, rNorm);

          float pulseCycle = fract(uTime * 0.14 * uSpeed + seed);
          radius += pulseCycle * 1.85 * bloomEase;

          float angularVel = (0.58 + (1.0 - rNorm) * 0.98) * uSpeed;
          float theta = baseAngle + uTime * angularVel + bloomEase * 2.0 * (1.0 - rNorm);

          float swirlWave = sin(theta * 3.0 + uTime * 1.45 + seed * 6.28) * (0.20 + 0.38 * bloomEase);
          float yLift = (rNorm * rNorm * 2.7 - 0.55) * bloomEase + ySpread * (0.65 + 2.0 * bloomEase) + swirlWave;

          vec3 p = vec3(cos(theta) * radius, yLift, sin(theta) * radius);

          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;

          float twinkle = 0.55 + 0.45 * sin(uTime * 3.8 + seed * 28.0);
          float size = (0.70 + pow(seed, 2.0) * 1.95) * (0.45 + 0.82 * bloomEase + uSurge * 0.38);
          gl_PointSize = size * uPixelRatio * (16.5 / -mv.z);

          float edgeFade = smoothstep(1.0, 0.70, rNorm) * (1.0 - smoothstep(0.65, 1.0, pulseCycle) * 0.65);
          vAlpha = edgeFade * twinkle * (0.20 + 0.72 * bloomEase + uSurge * 0.28);
          vColorMix = seed;
          vSparkle = step(0.80, seed) * twinkle;
        }
      `,
      fragmentShader: `
        uniform vec3 uColorA;
        uniform vec3 uColorB;
        varying float vAlpha;
        varying float vColorMix;
        varying float vSparkle;

        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;

          float core = smoothstep(0.16, 0.0, d);
          float glow = pow(1.0 - d * 2.0, 2.35);
          float alpha = (core * 0.88 + glow * 0.44) * vAlpha;

          vec3 col = mix(uColorA, uColorB, smoothstep(0.52, 0.90, vColorMix));
          col = mix(col, vec3(1.0), core * 0.58 + vSparkle * 0.48);

          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const vortexSystem = new THREE.Points(vortexGeo, vortexMaterial);
    flowerGroup.add(vortexSystem);

    // ==========================================
    // 10. 花心升腾的熔金花粉星尘柱 (Stardust Plume)
    // ==========================================
    const plumeCount = 2400;
    const plumeGeo = new THREE.BufferGeometry();
    const plumePos = new Float32Array(plumeCount * 3);
    const plumeSeed = new Float32Array(plumeCount * 3);

    for (let i = 0; i < plumeCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 0.7) * 1.4;
      plumePos[i * 3] = Math.cos(a) * r;
      plumePos[i * 3 + 1] = 0;
      plumePos[i * 3 + 2] = Math.sin(a) * r;

      plumeSeed[i * 3] = a;
      plumeSeed[i * 3 + 1] = r;
      plumeSeed[i * 3 + 2] = Math.random();
    }

    plumeGeo.setAttribute('position', new THREE.BufferAttribute(plumePos, 3));
    plumeGeo.setAttribute('aPlume', new THREE.BufferAttribute(plumeSeed, 3));

    const plumeMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uBloom: { value: state.currentBloom },
        uGold: { value: activeTheme.core.clone() },
        uAccent: { value: activeTheme.vortexA.clone() },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uBloom;
        uniform float uPixelRatio;
        attribute vec3 aPlume;
        varying float vAlpha;
        varying float vMix;

        void main() {
          float angle = aPlume.x;
          float baseR = aPlume.y;
          float seed = aPlume.z;

          float life = fract(uTime * 0.18 + seed);
          float bloomGate = smoothstep(0.25, 0.95, uBloom);

          float r = baseR * (0.4 + 0.8 * bloomGate) + pow(life, 1.5) * 2.6 * bloomGate;
          float theta = angle + life * 2.5 + uTime * 0.4;
          float y = 0.2 + pow(life, 0.85) * 5.2 * (0.3 + 0.7 * bloomGate);

          vec3 p = vec3(cos(theta) * r, y, sin(theta) * r);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;

          float env = sin(life * 3.14159265);
          gl_PointSize = (0.8 + seed * 1.6) * env * uPixelRatio * (15.0 / -mv.z);
          vAlpha = env * bloomGate * 0.65;
          vMix = seed;
        }
      `,
      fragmentShader: `
        uniform vec3 uGold;
        uniform vec3 uAccent;
        varying float vAlpha;
        varying float vMix;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float a = pow(1.0 - d * 2.0, 2.2) * vAlpha;
          vec3 col = mix(uGold, uAccent, smoothstep(0.6, 1.0, vMix));
          gl_FragColor = vec4(mix(col, vec3(1.0), 0.45), a);
        }
      `
    });

    const stardustPlume = new THREE.Points(plumeGeo, plumeMaterial);
    flowerGroup.add(stardustPlume);

    // ==========================================
    // 11. 编辑级 UI 交互逻辑绑定
    // ==========================================
    const meterFillEl = document.getElementById('meter-fill');
    const meterNumEl = document.getElementById('meter-num');

    document.querySelectorAll('.nav-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const key = btn.dataset.theme;
        activeTheme = THEMES[key];

        document.documentElement.style.setProperty('--accent', activeTheme.cssAccent);

        const newGeo = buildFlowerGeometry(activeTheme);
        flowerPoints.geometry.dispose();
        flowerPoints.geometry = newGeo;

        skyBgMaterial.uniforms.uZenith.value.copy(activeTheme.bgZenith);
        skyBgMaterial.uniforms.uHorizon.value.copy(activeTheme.bgHorizon);
        skyBgMaterial.uniforms.uAccent.value.copy(activeTheme.vortexA);
        skyBgMaterial.uniforms.uGold.value.copy(activeTheme.core);

        starMaterial.uniforms.uCoolColor.value.copy(activeTheme.vortexA);
        starMaterial.uniforms.uWarmColor.value.copy(activeTheme.core);

        oceanMaterial.uniforms.uDeepColor.value.copy(activeTheme.oceanDeep);
        oceanMaterial.uniforms.uCrestColor.value.copy(activeTheme.oceanCrest);
        oceanMaterial.uniforms.uGoldColor.value.copy(activeTheme.core);

        vortexMaterial.uniforms.uColorA.value.copy(activeTheme.vortexA);
        vortexMaterial.uniforms.uColorB.value.copy(activeTheme.vortexB);
        plumeMaterial.uniforms.uGold.value.copy(activeTheme.core);
        plumeMaterial.uniforms.uAccent.value.copy(activeTheme.vortexA);
      });
    });

    const btnMode = document.getElementById('btn-mode');
    const opticalMirror = document.getElementById('optical-mirror');
    btnMode.addEventListener('click', () => {
      params.autoBreathe = !params.autoBreathe;
      btnMode.textContent = params.autoBreathe ? 'MODE: BREATHE' : 'MODE: HAND';
      btnMode.classList.toggle('active', params.autoBreathe);
      opticalMirror.classList.toggle('hidden', params.autoBreathe);
    });

    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', () => {
      const isOn = soundEngine.toggle();
      btnSound.textContent = isOn ? 'SOUND: ON' : 'SOUND: OFF';
      btnSound.classList.toggle('active', isOn);
    });

    const flashVeil = document.getElementById('flash-veil');
    document.getElementById('btn-capture').addEventListener('click', () => {
      flashVeil.style.opacity = '0.55';
      setTimeout(() => { flashVeil.style.opacity = '0'; }, 80);

      composer.render();
      const dataURL = renderer.domElement.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `AETHERIA-StarlitOcean-${Date.now()}.png`;
      link.href = dataURL;
      link.click();
    });

    const tuningSheet = document.getElementById('tuning-sheet');
    const btnTune = document.getElementById('btn-tune');
    btnTune.addEventListener('click', () => {
      tuningSheet.classList.toggle('hidden');
      btnTune.classList.toggle('active');
    });

    document.getElementById('ctrl-vortex').addEventListener('input', (e) => {
      params.vortexSpeed = parseFloat(e.target.value);
      vortexMaterial.uniforms.uSpeed.value = params.vortexSpeed;
      document.getElementById('val-vortex').textContent = params.vortexSpeed.toFixed(2);
    });

    document.getElementById('ctrl-bloom').addEventListener('input', (e) => {
      params.bloomStrength = parseFloat(e.target.value);
      bloomPass.strength = params.bloomStrength;
      document.getElementById('val-bloom').textContent = params.bloomStrength.toFixed(2);
    });

    document.getElementById('ctrl-spin').addEventListener('input', (e) => {
      params.spinSpeed = parseFloat(e.target.value);
      document.getElementById('val-spin').textContent = params.spinSpeed.toFixed(2);
    });

    function togglePureMode() {
      document.body.classList.toggle('pure-mode');
    }
    document.getElementById('btn-hide').addEventListener('click', togglePureMode);
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') togglePureMode();
    });

    // ==========================================
    // 12. MediaPipe Hands 手势识别
    // ==========================================
    const videoElement = document.getElementById('input-video');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const loadingOverlay = document.getElementById('loading-overlay');

    function getDist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y, (p1.z || 0) - (p2.z || 0));
    }

    function analyzeHandOpenness(landmarks) {
      const wrist = landmarks[0];
      const middleMcp = landmarks[9];
      const palmScale = getDist(wrist, middleMcp) || 0.1;

      const tips = [4, 8, 12, 16, 20];
      let sum = 0;
      for (const i of tips) {
        sum += getDist(wrist, landmarks[i]);
      }
      const ratio = (sum / tips.length) / palmScale;
      return Math.max(0, Math.min(1, (ratio - 1.05) / 1.02));
    }

    function onHandsResults(results) {
      if (loadingOverlay && loadingOverlay.style.opacity !== '0') {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => loadingOverlay.remove(), 1100);
      }

      if (params.autoBreathe) return;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        state.handDetected = true;

        drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, { color: activeTheme.skeleton, lineWidth: 1.2 });
        drawLandmarks(canvasCtx, lm, { color: '#ffffff', lineWidth: 0.5, radius: 1.8 });

        const openness = analyzeHandOpenness(lm);
        state.targetBloom = openness;

        statusDot.classList.add('online');
        statusText.textContent = openness > 0.72
          ? 'STARLIT ANTHESIS · VORTEX ACTIVE'
          : (openness < 0.25 ? 'CHRYSALIS · DORMANT' : 'BLOOMING · SYNCHRONIZED');

        const indexTip = lm[8];
        const palm = lm[9];
        const tx = indexTip.x * 0.45 + palm.x * 0.55;
        const ty = indexTip.y * 0.45 + palm.y * 0.55;

        state.targetPos.set((0.5 - tx) * 5.2, (0.5 - ty) * 3.2 - 0.25, 0);
        state.targetRot.x = 0.32 + (ty - 0.5) * 0.62;
        state.targetRot.z = (tx - 0.5) * 0.52;
      } else {
        state.handDetected = false;
        statusDot.classList.remove('online');
        statusText.textContent = 'SENSOR STANDBY · SHOW PALM';

        state.targetBloom = 0.16;
        state.targetPos.set(0, -0.25, 0);
        state.targetRot.x = 0.32;
        state.targetRot.z = 0;
      }

      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => new URL(`./vendor/${file}`, location.href).href
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onHandsResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    cameraUtils.start().catch(() => {
      if (loadingOverlay) {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => loadingOverlay.remove(), 1100);
      }
      params.autoBreathe = true;
      btnMode.textContent = 'MODE: BREATHE';
      btnMode.classList.add('active');
      opticalMirror.classList.add('hidden');
      statusText.textContent = 'AUTONOMOUS BREATHING CYCLE';
    });

    // ==========================================
    // 13. 主渲染循环
    // ==========================================
    const clock = new THREE.Clock();
    let spinAngle = 0;
    let lastTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const dt = Math.min(0.05, elapsed - lastTime);
      lastTime = elapsed;

      controls.update();

      if (params.autoBreathe) {
        state.targetBloom = 0.5 + 0.48 * Math.sin(elapsed * 0.55 - 0.6);
        state.targetPos.set(0, -0.25 + Math.sin(elapsed * 0.55) * 0.18, 0);
        state.targetRot.x = 0.32;
        state.targetRot.z = 0;
        statusDot.classList.add('online');
        statusText.textContent = 'AUTONOMOUS BREATHING CYCLE';
      }

      const damping = 0.075;
      state.currentBloom += (state.targetBloom - state.currentBloom) * damping;

      const pct = Math.round(state.currentBloom * 100);
      meterFillEl.style.width = `${pct}%`;
      meterNumEl.textContent = `${pct}%`;

      const bloomVelocity = state.currentBloom - state.prevBloom;
      if (bloomVelocity > 0.012 && state.currentBloom > 0.38) {
        state.vortexSurge = Math.min(1.0, state.vortexSurge + bloomVelocity * 16.0);
        if (state.pulseWave <= 0.05) state.pulseWave = 0.06;
      }
      state.vortexSurge *= 0.94;

      if (state.pulseWave > 0) {
        state.pulseWave += 0.02;
        if (state.pulseWave > 1.25) state.pulseWave = 0;
      }
      state.prevBloom = state.currentBloom;

      soundEngine.update(state.currentBloom, bloomVelocity, elapsed);

      state.currentPos.lerp(state.targetPos, damping);
      state.currentRot.x += (state.targetRot.x - state.currentRot.x) * damping;
      state.currentRot.z += (state.targetRot.z - state.currentRot.z) * damping;

      skyBgMaterial.uniforms.uTime.value = elapsed;
      skyBgMaterial.uniforms.uBloom.value = state.currentBloom;

      starMaterial.uniforms.uTime.value = elapsed;
      starMaterial.uniforms.uBloom.value = state.currentBloom;
      starDome.rotation.y = elapsed * 0.012;

      oceanMaterial.uniforms.uTime.value = elapsed;
      oceanMaterial.uniforms.uBloom.value = state.currentBloom;
      oceanMaterial.uniforms.uPulse.value = state.pulseWave;

      flowerMaterial.uniforms.uTime.value = elapsed;
      flowerMaterial.uniforms.uBloom.value = state.currentBloom;
      flowerMaterial.uniforms.uPulse.value = state.pulseWave;

      vortexMaterial.uniforms.uTime.value = elapsed;
      vortexMaterial.uniforms.uBloom.value = state.currentBloom;
      vortexMaterial.uniforms.uSurge.value = state.vortexSurge;

      plumeMaterial.uniforms.uTime.value = elapsed;
      plumeMaterial.uniforms.uBloom.value = state.currentBloom;

      spinAngle += dt * params.spinSpeed;
      flowerGroup.position.copy(state.currentPos);
      flowerGroup.rotation.x = state.currentRot.x;
      flowerGroup.rotation.z = state.currentRot.z;
      flowerGroup.rotation.y = spinAngle;

      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      const pr = Math.min(window.devicePixelRatio, 2);
      renderer.setPixelRatio(pr);
      flowerMaterial.uniforms.uPixelRatio.value = pr;
      vortexMaterial.uniforms.uPixelRatio.value = pr;
      plumeMaterial.uniforms.uPixelRatio.value = pr;
      starMaterial.uniforms.uPixelRatio.value = pr;
      oceanMaterial.uniforms.uPixelRatio.value = pr;
      skyBgMaterial.uniforms.uResolution.value.set(w, h);
    });
  </script>
</body>
</html>
